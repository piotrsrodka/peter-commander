name: Release Assets

# Builds a Windows binary and attaches it to a GitHub Release — triggered
# automatically when a release is published, or manually (workflow_dispatch)
# to backfill an existing release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the Windows binary to"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-binary:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}
    - name: Build release binary
      run: cargo build --release --verbose
    - name: Upload to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload ${{ github.event.release.tag_name || inputs.tag }} target/release/peter-commander.exe --clobber
